<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="robots" content="noindex" />
    <title>Stay tuned · Arrab</title>
    <meta name="description" content="Arrab is on the way." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="./arrab-logo-white.png" />
  </head>
  <body>
    <header class="bar">
      <img class="logo" src="./arrab-logo-white.png" alt="Arrab" />
      <button class="lang" type="button" id="lang" aria-label="Switch to Arabic" title="العربية">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M3 12h18" />
          <path d="M12 3c2.6 2.4 4 5.5 4 9s-1.4 6.6-4 9c-2.6-2.4-4-5.5-4-9s1.4-6.6 4-9z" />
        </svg>
      </button>
    </header>
    <main class="stage">
      <div class="card">
        <p class="kicker" id="kicker"><span class="dot" aria-hidden="true"></span>Coming soon</p>
        <h1 id="title">Stay tuned</h1>
        <p class="lede" id="lede">
          <span id="lede-a">Arrab is almost here.</span>
          <span id="lede-b">We will open the doors when it is ready.</span>
        </p>
      </div>
    </main>
    <footer class="foot">
      <p class="mark" id="place">Saudi Arabia</p>
    </footer>
    <script>
      const copy = {
        en: {
          title: "Stay tuned · Arrab",
          kicker: "Coming soon",
          heading: "Stay tuned",
          lineA: "Arrab is almost here.",
          lineB: "We will open the doors when it is ready.",
          place: "Saudi Arabia",
          label: "Switch to Arabic",
          hint: "العربية",
        },
        ar: {
          title: "ترقّبوا · عرّاب",
          kicker: "قريباً",
          heading: "ترقّبوا",
          lineA: "عرّاب على وشك الوصول.",
          lineB: "نفتح الأبواب حين يجهز.",
          place: "المملكة العربية السعودية",
          label: "Switch to English",
          hint: "English",
        },
      };

      const root = document.documentElement;
      const button = document.getElementById("lang");
      const kicker = document.getElementById("kicker");
      const dot = kicker.querySelector(".dot");

      function apply(language) {
        const text = copy[language];
        root.lang = language;
        root.dir = language === "ar" ? "rtl" : "ltr";
        document.title = text.title;
        kicker.textContent = "";
        kicker.append(dot, document.createTextNode(text.kicker));
        document.getElementById("title").textContent = text.heading;
        document.getElementById("lede-a").textContent = text.lineA;
        document.getElementById("lede-b").textContent = text.lineB;
        document.getElementById("place").textContent = text.place;
        button.setAttribute("aria-label", text.label);
        button.title = text.hint;
        localStorage.setItem("arrab-soon-language", language);
      }

      const stored = localStorage.getItem("arrab-soon-language");
      apply(stored === "ar" ? "ar" : "en");
      button.addEventListener("click", () => {
        apply(root.lang === "ar" ? "en" : "ar");
      });
    </script>
  </body>
</html>
